name: kkiapay_flutter_sdk
description: KkiaPay allows businesses to safely receive payments by mobile money, credit card and bank account.
version: 1.1.0
support: kkiapay <support@kkiapay.me>
homepage: 'https://github.com/kkiapay/kkiapay-flutter-sdk'

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  socket_io_client: ^1.0.2
  intl:
  retrofit:
  dio:
  built_value:
  json_annotation:
  meta:

  stacked_shared: ^1.4.0
  stacked: ^3.4.2
  stacked_services: ^1.5.0
  url_launcher: ^6.2.1           # used for wave payment
  http: ^1.2.1
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0
  cupertino_icons: ^1.0.6
  logger: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  build_runner:
  hive_generator:

  stacked_generator:
  retrofit_generator:
  json_serializable:
  built_value_generator:

flutter:
  uses-material-design: true
